<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO Platform 文档中心</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Background layers -->
    <div class="bg-mesh">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="page">
        <header class="hero">
            <div class="hero-badge animate-in" style="--delay: 0">
                <span class="hero-badge-dot"></span>
                Documentation Hub
            </div>
            <h1 class="hero-title animate-in" style="--delay: 1">
                <span class="hero-title-main">IO Platform</span>
                <span class="hero-title-typed">
                    <span id="typewriter-text"></span><span class="type-cursor"></span>
                </span>
            </h1>
            <p class="hero-desc animate-in" style="--delay: 2">构建、部署与扩展的一站式技术指南。</p>
            <div class="search-bar animate-in" style="--delay: 3">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" placeholder="搜索文档、API 或指南..." disabled>
                <kbd>Ctrl K</kbd>
            </div>
        </header>

        <nav class="filter-nav animate-in" style="--delay: 4">
            <button class="filter-btn active">全部</button>
            <button class="filter-btn">前端组件</button>
            <button class="filter-btn">后端服务</button>
            <button class="filter-btn">开发工具</button>
        </nav>

        <main class="card-grid" id="docsGrid"></main>

        <footer class="footer">
            <span>© 2026 IO Platform Design System</span>
            <div class="footer-links">
                <a href="#">GitHub</a>
                <a href="#">Discord</a>
            </div>
        </footer>
    </div>

    <script type="module" src="./script.js"></script>
</body>

</html>
